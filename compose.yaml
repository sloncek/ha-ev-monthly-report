services:
  api:
    build: .
    image: energy-ledger:0.2.0
    container_name: energy-ledger-api
    command: ["uvicorn", "energy_ledger.api:app", "--host", "0.0.0.0", "--port", "8099", "--no-access-log"]
    restart: unless-stopped
    user: "10001:10001"
    environment:
      LEDGER_DATA_DIR: /data
      LEDGER_CONFIG: /config/config.json
      LEDGER_READ_TOKEN_FILE: /run/secrets/read_token
      LEDGER_WRITE_TOKEN_FILE: /run/secrets/write_token
      LEDGER_HA_SIGNING_SECRET_FILE: /run/secrets/ha_signing_secret
      LEDGER_MOJ_ELEKTRO_TOKEN_FILE: /run/secrets/moj_elektro_token
      LEDGER_SHADOW_MODE: "true"
    volumes:
      - ./data:/data
      - ./config:/config:ro
      - ./secrets/read_token:/run/secrets/read_token:ro
      - ./secrets/write_token:/run/secrets/write_token:ro
      - ./secrets/ha_signing_secret:/run/secrets/ha_signing_secret:ro
    networks: [ha_backend]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  parser:
    image: energy-ledger:0.2.0
    container_name: energy-ledger-parser
    command: ["python", "-m", "energy_ledger.worker"]
    restart: unless-stopped
    user: "10001:10001"
    network_mode: none
    environment:
      LEDGER_INBOX: /inbox
      LEDGER_OUTBOX: /outbox
    volumes:
      - ./data/inbox:/inbox:ro
      - ./data/outbox:/outbox:rw
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    depends_on: [api]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  ha_backend:
    external: true
    name: ${HA_DOCKER_NETWORK:?Set HA_DOCKER_NETWORK to the existing HA Docker network}
